  <style>
    :root {
      --base-color: #f8fafc;
      --active-color: #60a5fa;
    }
    /* Proportional zu bohrmakro.svg: .line 4.0 / .dim-line 1.2 bei viewBox-Breite 400 → Faktor 190/400 */
    .wk {
      fill: none;
      stroke: var(--base-color);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dim {
      fill: none;
      stroke: var(--base-color);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 120ms ease;
    }
    .lbl {
      font-weight: normal;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      fill: var(--base-color);
      stroke: none;
      transition: fill 120ms ease;
    }
    .overflow-frame {
      fill: none;
      stroke: var(--base-color);
      stroke-width: 0.57;
      stroke-dasharray: 2.4;
      stroke-linecap: round;
      stroke-opacity: 0;
      transition: stroke 120ms ease, stroke-opacity 120ms ease;
    }
    svg[data-active='areaWidth'] .hint-A .dim {
      stroke: var(--active-color);
    }
    svg[data-active='areaWidth'] .hint-A .lbl {
      fill: var(--active-color);
    }
    svg[data-active='areaHeight'] .hint-B .dim {
      stroke: var(--active-color);
    }
    svg[data-active='areaHeight'] .hint-B .lbl {
      fill: var(--active-color);
    }
    svg[data-active='areaStartX'] .hint-X .dim {
      stroke: var(--active-color);
    }
    svg[data-active='areaStartX'] .hint-X .lbl {
      fill: var(--active-color);
    }
    svg[data-active='areaStartY'] .hint-Y .dim {
      stroke: var(--active-color);
    }
    svg[data-active='areaStartY'] .hint-Y .lbl {
      fill: var(--active-color);
    }
    svg[data-active='cutterOverhangMm'] .overflow-frame {
      stroke: var(--active-color);
      stroke-opacity: 1;
    }
  </style>
