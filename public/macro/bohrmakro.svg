<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <marker id="arrowhead-up" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon class="dim-a" points="14 0, 0 5, 14 10" fill="#f8fafc" stroke="none"/>
    </marker>
    <marker id="arrowhead-down" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <polygon class="dim-a" points="0 0, 14 5, 0 10" fill="#f8fafc" stroke="none"/>
    </marker>
    <marker id="arrowhead-up-b" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon class="dim-b" points="14 0, 0 5, 14 10" fill="#f8fafc" stroke="none"/>
    </marker>
    <marker id="arrowhead-down-b" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <polygon class="dim-b" points="0 0, 14 5, 0 10" fill="#f8fafc" stroke="none"/>
    </marker>
    <marker id="arrowhead-up-c" markerWidth="12" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon class="dim-c" points="12 0, 0 4, 12 8" fill="#f8fafc" stroke="none"/>
    </marker>
    <marker id="arrowhead-down-c" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon class="dim-c" points="0 0, 12 4, 0 8" fill="#f8fafc" stroke="none"/>
    </marker>
  </defs>
  
  <style>
    :root {
      --base-color: #f8fafc;
      --active-color: #60a5fa;
    }

    .line { stroke: #f8fafc; stroke-width: 4.0; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .drill-flute { stroke: #f8fafc; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dim-line { stroke: #f8fafc; stroke-width: 1.2; fill: none; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 32px; fill: #f8fafc; text-anchor: middle; font-weight: normal; }

    .dim-a,
    .dim-b,
    .dim-c,
    .text-a,
    .text-b,
    .text-c {
      transition: stroke 120ms ease, fill 120ms ease;
    }

    .dim-line.dim-c { stroke-dasharray: 6 5; }

    svg[data-active='vorschubHoeheMm'] .dim-line.dim-a { stroke: var(--active-color); }
    svg[data-active='vorschubHoeheMm'] polygon.dim-a { fill: var(--active-color); }
    svg[data-active='depth'] .dim-line.dim-b { stroke: var(--active-color); }
    svg[data-active='depth'] polygon.dim-b { fill: var(--active-color); }
    svg[data-active='einstechtiefeMm'] .dim-line.dim-c { stroke: var(--active-color); }
    svg[data-active='einstechtiefeMm'] polygon.dim-c { fill: var(--active-color); }
    svg[data-active='vorschubHoeheMm'] .text-a { fill: var(--active-color); }
    svg[data-active='depth'] .text-b { fill: var(--active-color); }
    svg[data-active='einstechtiefeMm'] .text-c { fill: var(--active-color); }
  </style>

  <line x1="160" y1="20" x2="160" y2="230" class="line" />
  <line x1="240" y1="20" x2="240" y2="230" class="line" />
  
  <path d="M 162 100 Q 200 80 238 60" class="drill-flute" />
  <path d="M 162 160 Q 200 140 238 120" class="drill-flute" />
  <path d="M 162 220 Q 200 200 238 180" class="drill-flute" />
  
  <path d="M 160 230 L 200 250 L 240 230" class="line" />

  <path d="M 20 330 H 160 V 460 L 200 480 L 240 460 V 330 H 380 V 540 H 20 Z" class="line" />
  
  <line x1="202" y1="250" x2="310" y2="250" class="dim-line" />
  <line x1="250" y1="330" x2="310" y2="330" class="dim-line" />
  <line x1="202" y1="480" x2="310" y2="480" class="dim-line" />

  <line x1="280" y1="250" x2="280" y2="330" class="dim-line dim-a" marker-start="url(#arrowhead-up)" marker-end="url(#arrowhead-down)" />
  <line x1="280" y1="330" x2="280" y2="480" class="dim-line dim-b" marker-start="url(#arrowhead-up-b)" marker-end="url(#arrowhead-down-b)" />

  <line x1="330" y1="330" x2="330" y2="400" class="dim-line dim-c" marker-start="url(#arrowhead-up-c)" marker-end="url(#arrowhead-down-c)" />

  <text x="305" y="295" class="text text-a" dy=".3em">A</text>
  <text x="305" y="410" class="text text-b" dy=".3em">B</text>
  <text x="355" y="368" class="text text-c" dy=".3em">C</text>
</svg>
