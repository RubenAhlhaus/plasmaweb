# Copy these lines into your machine INI (adjust paths as needed).

[DISPLAY]
DISPLAY = lcncgui
PROGRAM_PREFIX = nc_files
INCREMENTS = 1 mm, 0.5 mm, 0.1 mm, 0.05 mm
# LATHE = 1

# Optional — macro subroutines (already installed with lcncgui; no copy needed):
#   system install:   /opt/lcncgui/resources/linuxcnc-subroutines
#   per-user install: ~/.local/share/lcncgui/resources/linuxcnc-subroutines
[RS274NGC]
SUBROUTINE_PATH = /opt/lcncgui/resources/linuxcnc-subroutines
